<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <!-- =========================
       PAGE INFO
  ========================== -->

  <title>Selected Work — Guy</title>

  <meta
    name="description"
    content="Selected visual work by Guy across key visual, illustration, motion, 3D and fine art."
  >


  <!-- =========================
       FAVICON
  ========================== -->

  <link
    rel="icon"
    href="favicon-v2.svg?v=2"
    type="image/svg+xml"
  >


  <!-- =========================
       CANONICAL
  ========================== -->

  <link
    rel="canonical"
    href="https://guysettawoots-max.github.io/guyyeahh/work.html"
  >


  <!-- =========================
       OPEN GRAPH
  ========================== -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="Guy"
  >

  <meta
    property="og:title"
    content="Selected Work — Guy"
  >

  <meta
    property="og:description"
    content="Selected visual work across key visual, illustration, motion, 3D and fine art."
  >

  <meta
    property="og:url"
    content="https://guysettawoots-max.github.io/guyyeahh/work.html"
  >

  <meta
    property="og:image"
    content="https://guysettawoots-max.github.io/guyyeahh/images/project-01/thumbnail.jpg"
  >

  <meta
    property="og:image:alt"
    content="Selected work by Guy"
  >


  <!-- =========================
       X / TWITTER
  ========================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Selected Work — Guy"
  >

  <meta
    name="twitter:description"
    content="Selected visual work across key visual, illustration, motion, 3D and fine art."
  >

  <meta
    name="twitter:image"
    content="https://guysettawoots-max.github.io/guyyeahh/images/project-01/thumbnail.jpg"
  >


  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <header class="site-header">

    <nav class="navigation">


      <!-- LOGO -->

      <a
        class="logo"
        href="index.html"
      >
        GUY
      </a>



      <!-- MENU -->

      <div class="menu">


        <!-- ME -->

        <a
          class="menu-item"
          href="me.html"
        >
          ME
        </a>



        <!-- WORK -->

        <div
          class="work-menu"
          data-work-menu
        >

          <button
            class="menu-item work-toggle active"
            type="button"
            data-work-toggle
            aria-expanded="false"
          >

            WORK

            <span class="work-arrow">
              ↓
            </span>

          </button>


          <div class="work-dropdown">

            <a
              href="work.html?filter=all"
              data-dropdown-filter="all"
            >
              ALL
            </a>

            <a
              href="work.html?filter=kv"
              data-dropdown-filter="kv"
            >
              KV
            </a>

            <a
              href="work.html?filter=illustration"
              data-dropdown-filter="illustration"
            >
              ILLUSTRATION
            </a>

            <a
              href="work.html?filter=motion"
              data-dropdown-filter="motion"
            >
              MOTION
            </a>

            <a
              href="work.html?filter=3d"
              data-dropdown-filter="3d"
            >
              3D
            </a>

            <a
              href="work.html?filter=fine-art"
              data-dropdown-filter="fine-art"
            >
              FINE ART
            </a>

          </div>

        </div>



        <!-- ??? -->

        <a
          class="menu-item"
          href="unknown.html"
        >
          ???
        </a>



        <!-- CONTACT -->

        <a
          class="menu-item"
          href="contact.html"
        >
          CONTACT
        </a>


      </div>


    </nav>

  </header>



  <!-- =========================
       WORK PAGE
  ========================== -->

  <main class="work-page">


    <!-- =========================
         TOP / FILTER
    ========================== -->

    <section class="work-top">


      <div class="work-title">

        <p>
          WORK
        </p>

      </div>



      <div class="work-categories">


        <button
          class="work-filter-button is-active"
          type="button"
          data-filter="all"
          aria-pressed="true"
        >
          ALL
        </button>


        <button
          class="work-filter-button"
          type="button"
          data-filter="kv"
          aria-pressed="false"
        >
          KV
        </button>


        <button
          class="work-filter-button"
          type="button"
          data-filter="illustration"
          aria-pressed="false"
        >
          ILLUSTRATION
        </button>


        <button
          class="work-filter-button"
          type="button"
          data-filter="motion"
          aria-pressed="false"
        >
          MOTION
        </button>


        <button
          class="work-filter-button"
          type="button"
          data-filter="3d"
          aria-pressed="false"
        >
          3D
        </button>


        <button
          class="work-filter-button"
          type="button"
          data-filter="fine-art"
          aria-pressed="false"
        >
          FINE ART
        </button>


      </div>


    </section>



    <!-- =========================
         PROJECT GRID
    ========================== -->

    <section class="work-grid">



      <!-- =====================
           PROJECT 01
      ====================== -->

      <a
        class="project-link"
        href="project-01.html"

        data-project-card
        data-categories="kv illustration"
      >

        <article class="project-card">


          <div class="project-image-wrapper">


            <img
              class="project-image"

              src="images/project-01/thumbnail.jpg"

              alt="House of Count Party Halloween visual"

              loading="eager"

              fetchpriority="high"
            >


          </div>



          <div class="project-info">


            <h2>
              House of Count Party
            </h2>


            <p>
              KV / ILLUSTRATION / 2026
            </p>


          </div>


        </article>

      </a>



      <!-- =====================
           PROJECT 02

           KING POWER
      ====================== -->

      <a
        class="project-link"
        href="project-02.html"

        data-project-card
        data-categories="kv illustration"
      >

        <article class="project-card">


          <div class="project-image-wrapper">


            <img
              class="project-image"

              src="images/project-02/thumbnail.jpg"

              alt="King Power Songkran 2022 key visual"

              loading="lazy"

              decoding="async"
            >


          </div>



          <div class="project-info">


            <h2>
              King Power Songkran 2022
            </h2>


            <p>
              KV / ILLUSTRATION / 2022
            </p>


          </div>


        </article>

      </a>



      <!-- =====================
           EMPTY MESSAGE
      ====================== -->

      <p
        class="work-empty"
        data-work-empty
        hidden
      >
        NO PROJECTS HERE YET.
      </p>


    </section>


  </main>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>


</body>

</html>
