<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Card Template — Guy</title>

  <!--
    PRIVATE HELPER FILE ONLY.
    THIS FILE IS NOT A REAL PAGE OF THE WEBSITE.
  -->
  <meta name="robots" content="noindex, nofollow">
</head>

<body>

  <!-- ============================================================
       ??? / CHAOS CARD LIBRARY — EASY VERSION

       NORMAL WORKFLOW

       1. OPEN chaos-card-template.html
       2. FIND THE CARD TYPE YOU WANT
       3. COPY ONLY BETWEEN:

            COPY START
            ...
            COPY END

       4. OPEN unknown.html
       5. FIND: ADD NEW STUFF HERE — START
       6. PASTE THE CARD BETWEEN START AND END
       7. CHANGE ONLY THE ITEMS MARKED: EDIT THIS
       8. SAVE + REFRESH

       IMPORTANT — DO NOT REMOVE:
       data-chaos-card
       data-chaos-type
       data-chaos-audio-*
       data-chaos-no-drag
       data-chaos-window-*

       SIZE OPTIONS
       chaos-card--small
       chaos-card--medium
       chaos-card--large

       TEXT CARD COLOR OPTIONS
       chaos-card--black
       chaos-card--acid
       chaos-card--pink

       FILE FOLDERS
       SKETCH  → images/chaos/sketches/
       PHOTO   → images/chaos/photos/
       MUSIC   → audio/chaos/
  ============================================================ -->


  <!-- ============================================================
       01 — NEW SKETCH

       BEFORE USING:
       put your image here:
       images/chaos/sketches/

       EDIT ONLY:
       1. src="..."
       2. alt="..."
       3. caption text
  ============================================================ -->

  <template id="chaos-template-sketch">

    <!-- COPY START — SKETCH -->
    <article
      class="chaos-card chaos-card--medium"
      data-chaos-card
      data-chaos-type="sketch"
    >

      <!-- EDIT THIS: src + alt below -->
      <img
        src="images/chaos/sketches/sketch-002.jpg"
        alt="Sketch by Guy"
        loading="lazy"
        decoding="async"
        draggable="false"
      >

      <div class="chaos-card-caption">
        SKETCH_002.JPG <!-- EDIT THIS -->
      </div>

    </article>
    <!-- COPY END — SKETCH -->

  </template>


  <!-- ============================================================
       02 — NEW PHOTO

       BEFORE USING:
       put your image here:
       images/chaos/photos/

       EDIT ONLY:
       1. src="..."
       2. alt="..."
       3. caption text
  ============================================================ -->

  <template id="chaos-template-photo">

    <!-- COPY START — PHOTO -->
    <article
      class="chaos-card chaos-card--medium"
      data-chaos-card
      data-chaos-type="photo"
    >

      <!-- EDIT THIS: src + alt below -->
      <img
        src="images/chaos/photos/photo-002.jpg"
        alt="Photo by Guy"
        loading="lazy"
        decoding="async"
        draggable="false"
      >

      <div class="chaos-card-caption">
        IMG_002.JPG <!-- EDIT THIS -->
      </div>

    </article>
    <!-- COPY END — PHOTO -->

  </template>


  <!-- ============================================================
       03 — NEW NOTE

       NO EXTRA FILE NEEDED.

       EDIT ONLY:
       1. label
       2. note text

       OPTIONAL:
       change chaos-card--acid to:
       chaos-card--black
       chaos-card--pink
       or remove the color class for white.
  ============================================================ -->

  <template id="chaos-template-note">

    <!-- COPY START — NOTE -->
    <article
      class="chaos-card chaos-card--text chaos-card--small chaos-card--acid"
      data-chaos-card
      data-chaos-type="note"
    >

      <p class="chaos-small-label">
        NOTE / TODAY <!-- EDIT THIS -->
      </p>

      <p class="chaos-note">
        put your thought<br>
        here. <!-- EDIT THIS -->
      </p>

    </article>
    <!-- COPY END — NOTE -->

  </template>


  <!-- ============================================================
       04 — NEW MUSIC

       BEFORE USING:
       put your MP3 here:
       audio/chaos/

       EDIT ONLY:
       1. top label
       2. audio title
       3. meta text
       4. src="audio/chaos/YOUR-FILE.mp3"

       DO NOT REMOVE data-chaos-no-drag.
  ============================================================ -->

  <template id="chaos-template-audio">

    <!-- COPY START — MUSIC -->
    <article
      class="chaos-card chaos-card--text chaos-card--medium chaos-card--black chaos-audio-card"
      data-chaos-card
      data-chaos-type="audio"
      data-chaos-audio-card
    >

      <p class="chaos-small-label">
        AUDIO FILE / UNFINISHED <!-- EDIT THIS -->
      </p>

      <div class="chaos-wave" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="chaos-audio-title">
        demo-002.mp3 <!-- EDIT THIS -->
      </p>

      <p class="chaos-audio-meta">
        unfinished / whenever <!-- EDIT THIS -->
      </p>

      <div class="chaos-audio-controls" data-chaos-no-drag>

        <button
          class="chaos-audio-button"
          type="button"
          data-chaos-audio-toggle
        >
          PLAY
        </button>

        <span class="chaos-audio-time" data-chaos-audio-time>
          00:00 / --:--
        </span>

      </div>

      <audio
        preload="metadata"
        src="audio/chaos/demo-002.mp3"
        data-chaos-audio
      ></audio>

    </article>
    <!-- COPY END — MUSIC -->

  </template>


  <!-- ============================================================
       05 — MESSAGE BUTTON / DO NOT CLICK

       NO EXTRA FILE NEEDED.

       EDIT ONLY:
       1. label
       2. starting text
       3. button text
       4. each <li> message
  ============================================================ -->

  <template id="chaos-template-message-cycle">

    <!-- COPY START — MESSAGE BUTTON -->
    <article
      class="chaos-card chaos-card--text chaos-card--small chaos-card--acid chaos-action-card"
      data-chaos-card
      data-chaos-type="interaction"
      data-chaos-message-card
    >

      <p class="chaos-small-label">
        VERY IMPORTANT BUTTON <!-- EDIT THIS -->
      </p>

      <p
        class="chaos-action-output"
        data-chaos-message-output
        aria-live="polite"
      >
        do not click. <!-- EDIT THIS -->
      </p>

      <div class="chaos-action-controls" data-chaos-no-drag>
        <button
          class="chaos-action-button"
          type="button"
          data-chaos-message-button
        >
          DO NOT CLICK <!-- EDIT THIS -->
        </button>
      </div>

      <ul data-chaos-message-list hidden>
        <li>why did you click it?</li>       <!-- EDIT THIS -->
        <li>okay.</li>                       <!-- EDIT THIS -->
        <li>again?</li>                      <!-- EDIT THIS -->
        <li>this is becoming a problem.</li><!-- EDIT THIS -->
        <li>nothing happens.</li>            <!-- EDIT THIS -->
      </ul>

    </article>
    <!-- COPY END — MESSAGE BUTTON -->

  </template>


  <!-- ============================================================
       06 — MAKE WEBSITE WORSE

       NO EXTRA FILE NEEDED.

       EDIT ONLY:
       label / text / button wording.

       KEEP data-chaos-worse-button.
  ============================================================ -->

  <template id="chaos-template-make-worse">

    <!-- COPY START — MAKE WORSE -->
    <article
      class="chaos-card chaos-card--text chaos-card--medium chaos-card--black chaos-action-card"
      data-chaos-card
      data-chaos-type="interaction"
    >

      <p class="chaos-small-label">
        BAD IDEA GENERATOR <!-- EDIT THIS -->
      </p>

      <p class="chaos-big-note">
        make the website<br>
        worse for a second. <!-- EDIT THIS -->
      </p>

      <div class="chaos-action-controls" data-chaos-no-drag>
        <button
          class="chaos-action-button chaos-action-button--inverse"
          type="button"
          data-chaos-worse-button
        >
          MAKE IT WORSE <!-- EDIT THIS -->
        </button>
      </div>

    </article>
    <!-- COPY END — MAKE WORSE -->

  </template>


  <!-- ============================================================
       07 — FAKE DESKTOP WINDOW

       NO EXTRA FILE NEEDED FOR TEXT.

       EDIT ONLY:
       1. card label
       2. card text
       3. button text
       4. data-chaos-window-title="..."
       5. content inside <template data-chaos-window-content>

       YOU MAY PUT AN <img>, LINKS, OR TEXT INSIDE THE WINDOW.
  ============================================================ -->

  <template id="chaos-template-fake-window-card">

    <!-- COPY START — FAKE WINDOW -->
    <article
      class="chaos-card chaos-card--text chaos-card--medium chaos-card--pink chaos-action-card chaos-window-card"
      data-chaos-card
      data-chaos-type="interaction"
      data-chaos-window-card
    >

      <p class="chaos-small-label">
        PERSONAL FILE / MAYBE IMPORTANT <!-- EDIT THIS -->
      </p>

      <p class="chaos-big-note">
        something is hiding<br>
        in this file. <!-- EDIT THIS -->
      </p>

      <div class="chaos-action-controls" data-chaos-no-drag>
        <button
          class="chaos-action-button"
          type="button"
          data-chaos-window-open
          data-chaos-window-title="random-note.txt"
        >
          OPEN RANDOM-NOTE.TXT <!-- EDIT THIS -->
        </button>
      </div>

      <template data-chaos-window-content>

        <p class="chaos-window-kicker">
          RANDOM NOTE <!-- EDIT THIS -->
        </p>

        <p class="chaos-window-big-text">
          put anything here.<br>
          it does not need<br>
          to make sense. <!-- EDIT THIS -->
        </p>

        <div class="chaos-window-filemeta">
          <span>FILE: random-note.txt</span> <!-- EDIT THIS -->
          <span>STATUS: unfinished</span>   <!-- EDIT THIS -->
        </div>

      </template>

    </article>
    <!-- COPY END — FAKE WINDOW -->

  </template>


  <!-- ============================================================
       QUICK REMINDER

       ADDING A NEW ITEM DOES NOT REQUIRE NEW JAVASCRIPT.

       SKETCH / PHOTO / NOTE / MUSIC:
       copy → paste → edit marked text/path → save.

       If the LIVE Safari page ever behaves older than Chrome,
       first test in a Private Window. If it works there,
       clear Safari website data/cache for the site.
  ============================================================ -->

</body>
</html>
